name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sqlite3-sag (+ dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Lint (compile-check every module — zero extra dependencies)
        run: python -m compileall -q sqlite3_sag project_memory tests examples tools

      - name: Vendoring drift guard
        run: python tools/revendor.py check

      - name: Conformance fixtures regenerate no-op (frozen hash-parity contract)
        run: python tools/gen_fixtures.py && git diff --exit-code fixtures/

      - name: Smoke test — append, verify, tamper-detect
        run: python examples/append_and_verify.py

      - name: Smoke test — CLI (fresh journal, append + verify)
        run: |
          python -m sqlite3_sag append /tmp/ci-journal.db "ci smoke entry" --kind decision
          python -m sqlite3_sag verify /tmp/ci-journal.db

      - name: Test suite
        run: python -m pytest -q

  standalone:
    # The $0 floor: the wheel must install and run in a clean venv with no PYTHONPATH,
    # no editable install and no numpy. This is the only stage that proves the package
    # works for someone who is not standing in the source directory.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel into a clean venv and exercise it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp   # leave the repo so nothing resolves from the source tree
          /tmp/clean/bin/python -c "
          import sqlite3_sag, sys
          assert 'numpy' not in sys.modules, 'numpy must never be imported'
          print('standalone ok:', getattr(sqlite3_sag, '__version__', 'ok'))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    # CD: only on a version tag, and only downstream of every gate above. Write permission
    # is scoped to THIS job; the workflow default stays read-only. Nothing is published to
    # an external index — the artifact is attached to a release on the owner's account.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, standalone]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
